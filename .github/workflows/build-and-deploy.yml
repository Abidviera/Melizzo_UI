name: Build and Deploy (Secure)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  NODE_VERSION: '20'

jobs:
  build:
    name: Build & Obfuscate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # If using git-crypt, unlock with a secret key
          # fetch-depth: 0

      # - name: Unlock git-crypt
      #   run: echo "${{ secrets.GIT_CRYPT_KEY }}" | base64 -d | git crypt unlock -
      #   if: env.GIT_CRYPT_KEY != ''

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Inject secrets into environment file
        run: |
          sed -i "s|CI_REPLACE_API_URL|${{ secrets.API_URL }}|g" src/environments/environment.prod.ts
          sed -i "s|CI_REPLACE_WHATSAPP_SERVICE_URL|${{ secrets.WHATSAPP_SERVICE_URL }}|g" src/environments/environment.prod.ts
          sed -i "s|CI_REPLACE_ENCRYPTION_KEY|${{ secrets.APP_ENCRYPTION_KEY }}|g" src/environments/environment.prod.ts
          echo "Secrets injected into environment.prod.ts"
          # Verify no placeholders remain
          if grep -q 'CI_REPLACE_' src/environments/environment.prod.ts; then
            echo "ERROR: Placeholders remain in environment.prod.ts after injection!"
            exit 1
          fi
          echo "Verified: no placeholders remain"

      - name: Build production with obfuscation
        run: npm run build:secure

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/melizzo-ui/
          retention-days: 7

  # Deploy job — customize for your hosting provider
  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/melizzo-ui/

      - name: Deploy to Azure Static Web Apps
        if: env.AZURE_STATIC_WEB_APPS_URL != ''
        run: |
          echo "Deploying to Azure Static Web Apps..."
          # Add your Azure deployment steps here
          # az staticwebapp up --env production ...

      - name: Deploy to Netlify
        if: env.NETLIFY_AUTH_TOKEN != ''
        run: |
          echo "Deploying to Netlify..."
          # npx netlify deploy --prod --dir=dist/melizzo-ui/browser --auth=$NETLIFY_AUTH_TOKEN --site=$NETLIFY_SITE_ID

      - name: Deploy to S3
        if: env.AWS_S3_BUCKET != ''
        run: |
          echo "Deploying to S3..."
          # aws s3 sync dist/melizzo-ui/browser s3://$AWS_S3_BUCKET --delete
