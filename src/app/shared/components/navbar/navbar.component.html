<header [class.scrolled]="isScrolled" data-aos="fade-down" data-aos-delay="100">
  <div class="header-container">
    <div class="logo" (click)="navigateHome()">
      <img
        src="/logos/melizzoLogo.png"
        alt="MELIZZO"
        class="logo-text-image"
        loading="lazy"
      />
      <p class="logo-subtitle">Melt The Moment</p>
    </div>

    <nav class="nav" data-aos="fade-down" data-aos-delay="200">
      <p
        *ngFor="let item of navigationItems"
        [routerLink]="item.route"
        class="nav-link"
      >
        {{ item.label.toUpperCase() }}
      </p>
    </nav>

    <div class="header-icons" data-aos="fade-down" data-aos-delay="300">
      <button class="icon-btn" aria-label="Search">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <circle cx="11" cy="11" r="8" />
          <path d="m21 21-4.35-4.35" />
        </svg>
      </button>
      <button class="icon-btn" aria-label="Account">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
          <circle cx="12" cy="7" r="4" />
        </svg>
      </button>
      <button class="icon-btn" aria-label="Wishlist">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"
          />
        </svg>
      </button>
      <button class="icon-btn" aria-label="Cart">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <circle cx="9" cy="21" r="1" />
          <circle cx="20" cy="21" r="1" />
          <path
            d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"
          />
        </svg>
      </button>
    </div>

    <div class="mobile-header-actions">
      <button
        class="mobile-action-btn"
        aria-label="Search"
        (click)="openSearch()"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <circle cx="11" cy="11" r="8" />
          <path d="m21 21-4.35-4.35" />
        </svg>
      </button>
      <button class="mobile-action-btn" aria-label="Cart" (click)="openCart()">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <circle cx="9" cy="21" r="1" />
          <circle cx="20" cy="21" r="1" />
          <path
            d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"
          />
        </svg>
        <span class="badge" *ngIf="cartItemCount > 0">{{ cartItemCount }}</span>
      </button>
    </div>

    <button
      class="mobile-menu-toggle"
      [class.active]="isMobileMenuOpen"
      (click)="toggleMobileMenu()"
      aria-label="Toggle menu"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>
  </div>
</header>

<div
  class="mobile-menu-overlay"
  [class.active]="isMobileMenuOpen"
  (click)="closeMobileMenu()"
></div>

<nav class="mobile-menu" [class.active]="isMobileMenuOpen">
  <div class="mobile-menu-header">
    <div class="mobile-menu-logo">
      <img
        src="/logos/melizzoLogo.png"
        alt="MELIZZO"
        class="logo-text-image"
        loading="lazy"
      />
      <p class="logo-subtitle">Melt The Moment</p>
    </div>
    <button
      class="mobile-close-btn"
      (click)="closeMobileMenu()"
      aria-label="Close menu"
    >
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <line x1="18" y1="6" x2="6" y2="18" />
        <line x1="6" y1="6" x2="18" y2="18" />
      </svg>
    </button>
  </div>

  <div class="mobile-nav">
    <a
      *ngFor="let item of navigationItems"
      [routerLink]="item.route"
      class="mobile-nav-link"
      (click)="closeMobileMenu()"
    >
      {{ item.label }}
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <polyline points="9 18 15 12 9 6" />
      </svg>
    </a>
  </div>

  <div class="mobile-menu-footer">
    <div class="mobile-menu-icons">
      <button class="mobile-icon-btn" (click)="openAccount()">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
          <circle cx="12" cy="7" r="4" />
        </svg>
        <span>ACCOUNT</span>
      </button>
      <button class="mobile-icon-btn" (click)="openWishlist()">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"
          />
        </svg>
        <span>WISHLIST</span>
      </button>
      <button class="mobile-icon-btn" (click)="openOrders()">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path d="M21 10H3M21 6H3M21 14H3M21 18H3" />
        </svg>
        <span>ORDERS</span>
      </button>
    </div>

    <div class="mobile-contact-info">
      <div class="contact-item">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"
          />
        </svg>
        <a href="tel:+1234567890">+1 705 927-0127</a>
      </div>
      <div class="contact-item">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"
          />
          <polyline points="22,6 12,13 2,6" />
        </svg>
        <a href="mailto:infomelizzo.com">info&#64;melizzo.com</a>
      </div>
      <div class="contact-item">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z" />
          <circle cx="12" cy="10" r="3" />
        </svg>
        <span>525 Macintosh Grove, Peterborough, Ontario, Canada K9H 0K1</span>
      </div>
    </div>
  </div>
</nav>
